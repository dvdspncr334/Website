<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Your Cart | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>Cart</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
    </div>
  </header>

  <!-- Cart Content -->
  <div class="cart-container">
    <h2>Your Cart</h2>
    <!-- Example Cart Item (can be replaced dynamically) -->
    <div class="cart-item">
      <img src="images/telecaster1.jpg" alt="Telecaster Style">
      <div class="cart-item-details">
        <h4>Telecaster Ash Body</h4>
        <p>Qty: 1</p>
      </div>
      <div class="cart-item-price">$179.99</div>
      <button class="remove-btn">Remove</button>
    </div>

    <div class="cart-item">
      <img src="images/stratocaster1.jpg" alt="Stratocaster Style">
      <div class="cart-item-details">
        <h4>Stratocaster Walnut Body</h4>
        <p>Qty: 1</p>
      </div>
      <div class="cart-item-price">$210.99</div>
      <button class="remove-btn">Remove</button>
    </div>

    <!-- Checkout Button -->
    <a href="#" class="checkout-btn">Proceed to Checkout</a>
  </div>
</body>
</html>
