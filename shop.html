<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Shop | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <h1>JGV3D Guitar Bodies</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="cart.html">Cart</a>
    </div>
  </header>

  <!-- Toast -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <!-- Main Shop Content -->
  <div class="container">
    <!-- Sidebar with filters -->
    <div class="sidebar">
      <h3>Categories</h3>
      <div class="categories">
        <button onclick="filterProducts('all')">All</button>
      </div>
    </div>
    <!-- Divider Line -->
    <div class="divider"></div>
    <!-- Products container -->
    <div class="products-container">
      <h2>Shop Guitar Bodies</h2>
      <div class="products"></div>
    </div>
  </div>

  <script>
    /* ---------- CSV Loading and Parsing ---------- */
    let sortedProducts = [];
    const productsContainer = document.querySelector('.products');
    const categoriesContainer = document.querySelector('.categories');

    function parseCSV(text) {
      const lines = text.split('\n').map(line => line.trim()).filter(line => line);
      if (lines.length < 2) return [];
      
      const headers = lines[0].split(',').map(h => h.trim());
      const rows = [];
      
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim());
        if (values.length !== headers.length) {
          console.warn(`Skipping malformed row ${i}: ${lines[i]}`);
          continue;
        }
        const row = {};
        headers.forEach((header, idx) => {
          row[header] = values[idx];
        });
        rows.push(row);
      }
      
      return rows;
    }

    function createProductCard(item) {
      const card = document.createElement('div');
      card.className = 'product';
      card.dataset.category = item.category || '';
      card.dataset.id = item.id || '';
      
      const img = document.createElement('img');
      img.src = item.img || '';
      img.alt = item.title || 'Product';
      card.appendChild(img);
      
      const title = document.createElement('div');
      title.className = 'product-title';
      title.textContent = item.title || '';
      card.appendChild(title);
      
      const price = document.createElement('div');
      price.className = 'product-price';
      price.textContent = `$${parseFloat(item.price || 0).toFixed(2)}`;
      card.appendChild(price);
      
      const qtyControl = document.createElement('div');
      qtyControl.className = 'qty-control';
      qtyControl.innerHTML = `
        <button class="qty-btn minus" aria-label="Decrease quantity">−</button>
        <span class="qty-value">1</span>
        <button class="qty-btn plus" aria-label="Increase quantity">+</button>
      `;
      card.appendChild(qtyControl);
      
      const addBtn = document.createElement('button');
      addBtn.className = 'add-btn';
      addBtn.textContent = 'Add to Cart';
      card.appendChild(addBtn);
      
      return card;
    }

    function buildCategoryButtons(products) {
      const categories = new Set();
      products.forEach(p => {
        if (p.category) categories.add(p.category);
      });
      
      const sortedCategories = Array.from(categories).sort((a, b) =>
        a.localeCompare(b, undefined, { sensitivity: 'base' })
      );
      
      sortedCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        btn.onclick = () => filterProducts(cat);
        categoriesContainer.appendChild(btn);
      });
    }

    function renderProducts(category = 'all') {
      productsContainer.innerHTML = '';
      sortedProducts.forEach(card => {
        const match = category === 'all' || card.dataset.category === category;
        if (match) {
          card.style.display = 'block';
          productsContainer.appendChild(card);
        }
      });
    }

    function filterProducts(category) {
      renderProducts(category);
    }

    /* ---------- Cart helpers (localStorage) ---------- */
    const CART_KEY = 'jgv3d_cart';
    let toastTimeout;

    function loadCart() {
      try {
        return JSON.parse(localStorage.getItem(CART_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function showToast(message) {
      const toast = document.getElementById('toast');
      if (!toast) return;
      toast.textContent = message;
      toast.classList.add('show');
      clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => toast.classList.remove('show'), 2200);
    }

    function addToCart(card) {
      const id = card.dataset.id;
      const title = card.querySelector('.product-title')?.textContent.trim() || 'Item';
      const priceText = card.querySelector('.product-price')?.textContent.replace(/[^0-9.]/g, '') || '0';
      const price = parseFloat(priceText);
      const img = card.querySelector('img')?.getAttribute('src') || '';
      const qty = parseInt(card.querySelector('.qty-value')?.textContent || '1', 10);

      if (!id || !qty || qty < 1) return;

      const cart = loadCart();
      const existing = cart.find(item => item.id === id);
      if (existing) {
        existing.qty += qty;
      } else {
        cart.push({ id, title, price, img, qty });
      }
      saveCart(cart);

      // reset qty to 1 and show toast (non-blocking)
      const qtyEl = card.querySelector('.qty-value');
      if (qtyEl) qtyEl.textContent = '1';
      showToast(`${qty} × ${title} added to cart`);
    }

    /* ---------- Quantity controls wiring ---------- */
    function wireQuantityControls(card) {
      const minus = card.querySelector('.qty-btn.minus');
      const plus = card.querySelector('.qty-btn.plus');
      const display = card.querySelector('.qty-value');

      if (minus && plus && display) {
        minus.addEventListener('click', () => {
          const current = parseInt(display.textContent || '1', 10);
          display.textContent = Math.max(1, current - 1);
        });
        plus.addEventListener('click', () => {
          const current = parseInt(display.textContent || '1', 10);
          display.textContent = current + 1;
        });
      }

      const addBtn = card.querySelector('.add-btn');
      if (addBtn) {
        addBtn.addEventListener('click', () => addToCart(card));
      }
    }

    /* ---------- Load and Initialize ---------- */
    async function loadShopData() {
      try {
        const response = await fetch('data/shop.csv');
        if (!response.ok) {
          throw new Error(`Failed to load shop.csv: ${response.status}`);
        }
        
        const csvText = await response.text();
        const products = parseCSV(csvText);
        
        if (products.length === 0) {
          productsContainer.innerHTML = '<p style="color: #ddd; text-align: center;">No products available at this time.</p>';
          return;
        }
        
        // Build category buttons
        buildCategoryButtons(products);
        
        // Create product cards
        const productCards = products.map(createProductCard);
        
        // Sort products by category then title
        sortedProducts = productCards.sort((a, b) => {
          const catA = (a.dataset.category || '').toLowerCase();
          const catB = (b.dataset.category || '').toLowerCase();
          const titleA = (a.querySelector('.product-title')?.textContent || '').trim().toLowerCase();
          const titleB = (b.querySelector('.product-title')?.textContent || '').trim().toLowerCase();
          return catA.localeCompare(catB) || titleA.localeCompare(titleB);
        });
        
        // Wire up controls
        sortedProducts.forEach(wireQuantityControls);
        
        // Initial render
        renderProducts('all');
        
      } catch (error) {
        console.error('Error loading shop data:', error);
        productsContainer.innerHTML = '<p style="color: #ddd; text-align: center;">Failed to load products. Please try again later.</p>';
      }
    }

    // Initialize on page load
    loadShopData();
  </script>
</body>
</html>
