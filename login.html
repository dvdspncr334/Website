<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Login | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="auth-firebase.js"></script>
</head>
<body>
  <header class="header">
    <h1>Login</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About Us</a>
      <a href="faq.html">FAQ</a>
      <a href="usefullinks.html">Useful Links</a>
      <a href="cart.html" class="mini-cart" id="mini-cart">
        Cart
        <span class="mini-cart-count" id="mini-cart-count">0</span>
      </a>
      <a href="orders.html">My Orders</a>
    </div>
  </header>

  <div class="about-container">
    <h2>Account Login</h2>
    <p>
      Sign in with your email and password or Google account. Your cart stays in this browser.
    </p>

    <div style="max-width:360px; margin:20px auto; text-align:center;">
      <p id="auth-status" role="status" aria-live="polite">Loading sign-in…</p>
      <div id="sign-in-options">
        <form id="email-signin">
          <fieldset id="auth-fields" disabled style="border:0; padding:0;">
            <p>
              <label for="auth-email">Email</label><br>
              <input id="auth-email" type="email" autocomplete="email" required>
            </p>
            <p>
              <label for="auth-password">Password</label><br>
              <input id="auth-password" type="password" autocomplete="current-password" required>
            </p>
            <button type="submit" class="add-btn">Sign in</button>
            <button type="submit" id="create-account" class="add-btn">Create account</button>
            <p><button type="button" id="reset-password">Forgot password?</button></p>
            <p>or</p>
            <button type="button" id="google-signin" class="add-btn">Sign in with Google</button>
          </fieldset>
        </form>
      </div>
      <div id="signed-in" hidden>
        <p id="auth-user"></p>
        <p><a href="orders.html">View My Orders</a></p>
        <button type="button" id="sign-out" class="add-btn">Sign out</button>
      </div>
      <noscript>JavaScript is required to sign in.</noscript>
      <p class="custom-color-help" style="text-align:center;">
        Questions? Feel free to
        <a href="mailto:support@jgv3d.com">contact us</a>.
      </p>
    </div>
  </div>

  <script>
    function updateMiniCart() {
      try {
        const cart = JSON.parse(localStorage.getItem('jgv3d_cart')) || [];
        const totalItems = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
        const miniCartCount = document.getElementById('mini-cart-count');
        if (miniCartCount) {
          miniCartCount.textContent = totalItems;
          miniCartCount.style.display = totalItems > 0 ? 'flex' : 'none';
        }
      } catch (e) {}
    }
    updateMiniCart();
  </script>
</body>
</html>
