<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Gallery | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <h1>JGV3D Guitar Bodies</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About Us</a>
      <a href="usefullinks.html">Useful Links</a>
      <a href="cart.html" class="mini-cart" id="mini-cart">
        Cart
        <span class="mini-cart-count" id="mini-cart-count">0</span>
      </a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <!-- Click overlay for enlarged preview -->
  <div id="gallery-modal" class="gallery-overlay" aria-hidden="true">
    <div class="gallery-overlay-content">
      <button class="gallery-overlay-close" aria-label="Close preview">×</button>
      <div class="gallery-overlay-image-wrap">
        <button id="overlay-prev" class="gallery-overlay-nav" aria-label="Previous image">‹</button>
        <img id="overlay-img" alt="">
        <button id="overlay-next" class="gallery-overlay-nav" aria-label="Next image">›</button>
      </div>
      <div class="gallery-overlay-counter" id="overlay-counter"></div>
      <div class="gallery-overlay-thumbs" id="overlay-thumbs"></div>
      <div class="gallery-overlay-title" id="overlay-title"></div>
      <div class="gallery-overlay-label" id="overlay-label"></div>
    </div>
  </div>

  <!-- Main Gallery Content -->
  <div class="container">
    <div class="sidebar">
      <h3>Categories</h3>
      <div class="categories" id="categories-container">
        <!-- Auto-generated from CSV -->
      </div>
      <h3 style="margin-top: 20px;">Subcategories</h3>
      <div id="subcategory-container">
        <select class="subcategory-select" id="subcategory-filter">
          <option value="all">All Subcategories</option>
        </select>
      </div>
    </div>

    <div class="divider"></div>

    <div class="products-container">
      <h2>Gallery</h2>
      <div class="search-sort-controls">
        <input type="text" class="search-box" id="search-box" placeholder="Search gallery..." />
        <select class="sort-select" id="sort-select">
          <option value="default">Sort: Default</option>
          <option value="title-asc">Sort: Title A→Z</option>
        </select>
      </div>
      <div class="products" id="products-container"></div>
    </div>
  </div>

  <script>
    /* ---------- State and Constants ---------- */
    const CATEGORY_KEY = 'jgv3d_gallery_category';
    const SUBCATEGORY_KEY = 'jgv3d_gallery_subcategory';
    const IMAGE_SELECTION_KEY = 'jgv3d_gallery_image_selection';
    
    let allItems = [];
    let currentCategory = localStorage.getItem(CATEGORY_KEY) || 'all';
    let currentSubcategory = localStorage.getItem(SUBCATEGORY_KEY) || 'all';
    let currentSort = 'default';
    let searchQuery = '';

    const productsContainer = document.getElementById('products-container');
    const categoriesContainer = document.getElementById('categories-container');
    const subcategoryFilter = document.getElementById('subcategory-filter');
    const searchBox = document.getElementById('search-box');
    const sortSelect = document.getElementById('sort-select');

    /* ---------- Image Selection Persistence ---------- */
    function getSavedImageSelections() {
      try {
        return JSON.parse(localStorage.getItem(IMAGE_SELECTION_KEY)) || {};
      } catch (e) {
        return {};
      }
    }

    function getItemKey(item) {
      return item.id || item.title || '';
    }

    function saveImageSelection(item, index) {
      const key = getItemKey(item);
      if (!key) return;
      const selections = getSavedImageSelections();
      selections[key] = index;
      try {
        localStorage.setItem(IMAGE_SELECTION_KEY, JSON.stringify(selections));
      } catch (e) {}
    }

    function getSavedImageIndex(item, maxIndex) {
      const key = getItemKey(item);
      if (!key) return null;
      const selections = getSavedImageSelections();
      const saved = selections[key];
      if (typeof saved === 'number' && saved >= 0 && saved <= maxIndex) {
        return saved;
      }
      return null;
    }

    /* ---------- CSV Parsing ---------- */
    function parseCSV(text) {
      const lines = text.split('\n').map(line => line.trim()).filter(Boolean);
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map(h => h.trim());
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim());
        if (values.length === headers.length) {
          const obj = {};
          headers.forEach((h, idx) => { obj[h] = values[idx]; });
          rows.push(obj);
        } else {
          console.warn('Skipping malformed CSV row:', lines[i]);
        }
      }
      return rows;
    }

    /* ---------- Modal helpers ---------- */
    const PLACEHOLDER_IMG = 'images/placeholder.png';
    const overlay = document.getElementById('gallery-modal');
    const overlayImg = document.getElementById('overlay-img');
    const overlayPrev = document.getElementById('overlay-prev');
    const overlayNext = document.getElementById('overlay-next');
    const overlayCounter = document.getElementById('overlay-counter');
    const overlayThumbs = document.getElementById('overlay-thumbs');
    const overlayTitle = document.getElementById('overlay-title');
    const overlayLabel = document.getElementById('overlay-label');
    let overlayImages = [];
    let overlayImageIndex = 0;
    let overlayItem = null;

    function getMultiImages(item) {
      return (item.images || '')
        .split('|')
        .map(img => img.trim())
        .filter(Boolean);
    }

    function getItemImages(item) {
      const images = getMultiImages(item);
      return images.length ? images : [item.img || PLACEHOLDER_IMG];
    }

    function updateOverlayImage() {
      const hasMultiple = overlayImages.length > 1;
      const src = overlayImages[overlayImageIndex] || PLACEHOLDER_IMG;
      overlayImg.src = src;
      overlayImg.alt = (overlayItem && overlayItem.title) || 'Preview';
      overlayImg.onerror = () => { overlayImg.src = PLACEHOLDER_IMG; };
      overlayTitle.textContent = (overlayItem && overlayItem.title) || '';
      overlayLabel.textContent = (overlayItem && overlayItem.label) || '';
      overlayPrev.style.display = hasMultiple ? 'flex' : 'none';
      overlayNext.style.display = hasMultiple ? 'flex' : 'none';
      overlayCounter.textContent = hasMultiple ? `${overlayImageIndex + 1} / ${overlayImages.length}` : '';
      overlayThumbs.innerHTML = '';

      if (hasMultiple) {
        overlayImages.forEach((imgPath, idx) => {
          const button = document.createElement('button');
          button.type = 'button';
          button.className = `gallery-overlay-thumb${idx === overlayImageIndex ? ' active' : ''}`;
          button.setAttribute('aria-label', `View image ${idx + 1}`);
          button.innerHTML = `<img src="${imgPath}" alt="${(overlayItem && overlayItem.title) || 'Preview'} ${idx + 1}" onerror="this.src='${PLACEHOLDER_IMG}'">`;
          button.addEventListener('click', (e) => {
            e.stopPropagation();
            overlayImageIndex = idx;
            updateOverlayImage();
            if (overlayItem) {
              saveImageSelection(overlayItem, overlayImageIndex);
              syncCardSelection(overlayItem, overlayImageIndex);
            }
          });
          overlayThumbs.appendChild(button);
        });
      }
    }

    function showOverlay(item, startIndex = 0) {
      overlayItem = item;
      overlayImages = getItemImages(item);
      overlayImageIndex = Math.max(0, Math.min(startIndex, overlayImages.length - 1));
      updateOverlayImage();
      overlay.classList.add('show');
      overlay.setAttribute('aria-hidden', 'false');
    }

    function hideOverlay() {
      overlay.classList.remove('show');
      overlay.setAttribute('aria-hidden', 'true');
    }

    overlay.addEventListener('click', (e) => {
      if (e.target === overlay || e.target.classList.contains('gallery-overlay-close')) {
        hideOverlay();
      }
    });

    overlayPrev.addEventListener('click', (e) => {
      e.stopPropagation();
      if (overlayImages.length > 1) {
        overlayImageIndex = (overlayImageIndex - 1 + overlayImages.length) % overlayImages.length;
        updateOverlayImage();
        if (overlayItem) {
          saveImageSelection(overlayItem, overlayImageIndex);
          syncCardSelection(overlayItem, overlayImageIndex);
        }
      }
    });

    overlayNext.addEventListener('click', (e) => {
      e.stopPropagation();
      if (overlayImages.length > 1) {
        overlayImageIndex = (overlayImageIndex + 1) % overlayImages.length;
        updateOverlayImage();
        if (overlayItem) {
          saveImageSelection(overlayItem, overlayImageIndex);
          syncCardSelection(overlayItem, overlayImageIndex);
        }
      }
    });

    /* ---------- Keep gallery card in sync with overlay selection ---------- */
    function syncCardSelection(item, index) {
      const key = getItemKey(item);
      if (!key) return;
      const card = productsContainer.querySelector(`.product[data-key="${CSS.escape(key)}"]`);
      if (card && typeof card.__setSelectedImage === 'function') {
        card.__setSelectedImage(index);
      }
    }

    /* ---------- Card creation ---------- */
    function createGalleryCard(item) {
      const PLACEHOLDER_IMG = 'images/placeholder.png';
      
      const card = document.createElement('div');
      card.className = 'product';
      card.dataset.category = item.category || '';
      card.dataset.subcategory = item.subcategory || '';
      card.dataset.title = item.title || '';
      card.dataset.key = getItemKey(item);

      const imgSrc = item.img || PLACEHOLDER_IMG;
      const multiImages = getMultiImages(item);
      const hasMultiImages = multiImages.length > 0;
      const defaultIndex = hasMultiImages ? Math.max(0, multiImages.indexOf(imgSrc)) : 0;
      const savedIndex = hasMultiImages ? getSavedImageIndex(item, multiImages.length - 1) : null;
      const initialImageIndex = savedIndex !== null ? savedIndex : defaultIndex;
      let selectedImageIndex = initialImageIndex;
      const thumbStrip = hasMultiImages ? `
        <div class="gallery-thumb-strip">
          ${multiImages.map((img, idx) => `
            <button type="button" class="gallery-thumb-btn${idx === initialImageIndex ? ' active' : ''}" data-index="${idx}" aria-label="View ${item.title || 'gallery item'} image ${idx + 1}">
              <img src="${img}" alt="${item.title || 'Gallery Item'} ${idx + 1}" onerror="this.src='${PLACEHOLDER_IMG}'">
            </button>
          `).join('')}
        </div>
      ` : '';

      card.innerHTML = `
        <div class="gallery-img-wrap">
          <img class="gallery-main-img" src="${hasMultiImages ? multiImages[initialImageIndex] : imgSrc}" alt="${item.title || 'Gallery Item'}" onerror="this.src='${PLACEHOLDER_IMG}'">
        </div>
        ${thumbStrip}
        <div class="product-title">${item.title || ''}</div>
        <div class="product-price">${item.label || ''}</div>
      `;

      if (hasMultiImages) {
        const mainImg = card.querySelector('.gallery-main-img');
        const thumbButtons = card.querySelectorAll('.gallery-thumb-btn');

        const setSelectedImage = (idx) => {
          if (idx < 0 || idx >= multiImages.length) return;
          selectedImageIndex = idx;
          mainImg.src = multiImages[idx] || imgSrc;
          thumbButtons.forEach((button) => button.classList.remove('active'));
          const target = card.querySelector(`.gallery-thumb-btn[data-index="${idx}"]`);
          if (target) target.classList.add('active');
        };
        card.__setSelectedImage = setSelectedImage;

        thumbButtons.forEach((btn) => {
          btn.addEventListener('click', (e) => {
            e.stopPropagation();
            const idx = Number(btn.dataset.index) || 0;
            setSelectedImage(idx);
            saveImageSelection(item, idx);
            showOverlay(item, idx);
          });
        });
      }

      card.addEventListener('click', () => showOverlay(item, selectedImageIndex));
      return card;
    }

    /* ---------- Load Gallery ---------- */
    async function loadGallery() {
      try {
        const response = await fetch('data/gallery.csv?t=' + Date.now(), { cache: 'no-store' });
        if (!response.ok) throw new Error('Failed to load gallery.csv');
        const text = await response.text();
        allItems = parseCSV(text);

        if (allItems.length === 0) {
          productsContainer.innerHTML = '<p style="color:#ddd;">No gallery items available.</p>';
          return;
        }

        generateCategoryButtons();
        updateSubcategoryFilter();
        renderGallery();
      } catch (error) {
        console.error('Error loading gallery:', error);
        productsContainer.innerHTML = '<p style="color:#ddd;">Failed to load gallery items. Please try again later.</p>';
      }
    }

    /* ---------- Generate Category Buttons ---------- */
    function generateCategoryButtons() {
      const categories = new Set();
      allItems.forEach(item => {
        if (item.category) categories.add(item.category);
      });

      const sortedCategories = Array.from(categories).sort();
      
      categoriesContainer.innerHTML = '';
      
      // Add "All" button
      const allBtn = document.createElement('button');
      allBtn.textContent = 'All';
      allBtn.onclick = () => filterByCategory('all');
      categoriesContainer.appendChild(allBtn);

      // Add category buttons
      sortedCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        btn.onclick = () => filterByCategory(cat);
        categoriesContainer.appendChild(btn);
      });
    }

    /* ---------- Update Subcategory Filter ---------- */
    function updateSubcategoryFilter() {
      const subcategories = new Set();
      allItems.forEach(item => {
        if (currentCategory === 'all' || item.category === currentCategory) {
          if (item.subcategory) subcategories.add(item.subcategory);
        }
      });

      const sortedSubcategories = Array.from(subcategories).sort();
      
      subcategoryFilter.innerHTML = '<option value="all">All Subcategories</option>';
      sortedSubcategories.forEach(sub => {
        const option = document.createElement('option');
        option.value = sub;
        option.textContent = sub.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
        subcategoryFilter.appendChild(option);
      });

      subcategoryFilter.value = currentSubcategory;
    }

    /* ---------- Filter and Render ---------- */
    function filterByCategory(category) {
      currentCategory = category;
      currentSubcategory = 'all';
      localStorage.setItem(CATEGORY_KEY, category);
      localStorage.setItem(SUBCATEGORY_KEY, 'all');
      updateSubcategoryFilter();
      renderGallery();
    }

    function filterBySubcategory() {
      currentSubcategory = subcategoryFilter.value;
      localStorage.setItem(SUBCATEGORY_KEY, currentSubcategory);
      renderGallery();
    }

    function applySearch() {
      searchQuery = searchBox.value.toLowerCase();
      renderGallery();
    }

    function applySort() {
      currentSort = sortSelect.value;
      renderGallery();
    }

    function matchesFilters(item) {
      // Category filter
      if (currentCategory !== 'all' && item.category !== currentCategory) {
        return false;
      }

      // Subcategory filter
      if (currentSubcategory !== 'all' && item.subcategory !== currentSubcategory) {
        return false;
      }

      // Search filter
      if (searchQuery) {
        const searchText = [
          item.title,
          item.category,
          item.subcategory,
          item.label
        ].join(' ').toLowerCase();
        
        if (!searchText.includes(searchQuery)) {
          return false;
        }
      }

      return true;
    }

    function renderGallery() {
      const filtered = allItems.filter(matchesFilters);

      // Sort items
      let sorted = [...filtered];
      if (currentSort === 'title-asc') {
        sorted.sort((a, b) => (a.title || '').localeCompare(b.title || ''));
      } else {
        // Default: category then title
        sorted.sort((a, b) => {
          const catCmp = (a.category || '').localeCompare(b.category || '');
          return catCmp !== 0 ? catCmp : (a.title || '').localeCompare(b.title || '');
        });
      }

      productsContainer.innerHTML = '';
      
      if (sorted.length === 0) {
        productsContainer.innerHTML = '<p style="color:#ddd;">No gallery items match your filters.</p>';
        return;
      }

      sorted.forEach(item => {
        const card = createGalleryCard(item);
        productsContainer.appendChild(card);
      });
    }

    /* ---------- Event Listeners ---------- */
    subcategoryFilter.addEventListener('change', filterBySubcategory);
    
    let searchDebounce;
    searchBox.addEventListener('input', () => {
      clearTimeout(searchDebounce);
      searchDebounce = setTimeout(applySearch, 300);
    });

    sortSelect.addEventListener('change', applySort);

    /* ---------- Initialize ---------- */
    function updateMiniCart() {
      try {
        const cart = JSON.parse(localStorage.getItem('jgv3d_cart')) || [];
        const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
        const miniCartCount = document.getElementById('mini-cart-count');
        if (miniCartCount) {
          miniCartCount.textContent = totalItems;
          miniCartCount.style.display = totalItems > 0 ? 'flex' : 'none';
        }
      } catch (e) {}
    }

    loadGallery();
    updateMiniCart();
  </script>
</body>
</html>
