<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <h1>JGV3D Guitar Bodies</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About Us</a>
      <a href="cart.html">Cart</a>
      <a href="UsefulLinks.html">Useful Links</a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <!-- Main Gallery Content -->
  <div class="container">
    <!-- Sidebar with filters -->
    <div class="sidebar">
      <h3>Categories</h3>
      <div class="categories">
        <button onclick="filterGallery('all')">All</button>
      </div>
    </div>

    <!-- Divider Line -->
    <div class="divider"></div>

    <!-- Gallery container -->
    <div class="products-container">
      <h2>Gallery</h2>
      <div class="products"></div>
    </div>
  </div>

  <script>
    /* ---------- CSV Loading and Parsing ---------- */
    let sortedProducts = [];
    const productsContainer = document.querySelector('.products');
    const categoriesContainer = document.querySelector('.categories');

    function parseCSV(text) {
      const lines = text.split('\n').map(line => line.trim()).filter(line => line);
      if (lines.length < 2) return [];
      
      const headers = lines[0].split(',').map(h => h.trim());
      const rows = [];
      
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim());
        if (values.length !== headers.length) {
          console.warn(`Skipping malformed row ${i}: ${lines[i]}`);
          continue;
        }
        const row = {};
        headers.forEach((header, idx) => {
          row[header] = values[idx];
        });
        rows.push(row);
      }
      
      return rows;
    }

    function createGalleryCard(item) {
      const card = document.createElement('div');
      card.className = 'product';
      card.dataset.category = item.category || '';
      
      const img = document.createElement('img');
      img.src = item.img || '';
      img.alt = item.title || 'Gallery Item';
      card.appendChild(img);
      
      const title = document.createElement('div');
      title.className = 'product-title';
      title.textContent = item.title || '';
      card.appendChild(title);
      
      const label = document.createElement('div');
      label.className = 'product-price';
      label.textContent = item.label || '';
      card.appendChild(label);
      
      return card;
    }

    function buildCategoryButtons(items) {
      const categories = new Set();
      items.forEach(item => {
        if (item.category) categories.add(item.category);
      });
      
      const sortedCategories = Array.from(categories).sort((a, b) =>
        a.localeCompare(b, undefined, { sensitivity: 'base' })
      );
      
      sortedCategories.forEach(cat => {
        const btn = document.createElement('button');
        btn.textContent = cat.charAt(0).toUpperCase() + cat.slice(1);
        btn.onclick = () => filterGallery(cat);
        categoriesContainer.appendChild(btn);
      });
    }

    function renderGallery(category = 'all') {
      productsContainer.innerHTML = '';
      sortedProducts.forEach(card => {
        const match = category === 'all' || card.dataset.category === category;
        if (match) {
          card.style.display = 'block';
          productsContainer.appendChild(card);
        }
      });
    }

    function filterGallery(category) {
      renderGallery(category);
    }

    /* ---------- Load and Initialize ---------- */
    async function loadGalleryData() {
      try {
        const response = await fetch('data/gallery.csv');
        if (!response.ok) {
          throw new Error(`Failed to load gallery.csv: ${response.status}`);
        }
        
        const csvText = await response.text();
        const items = parseCSV(csvText);
        
        if (items.length === 0) {
          productsContainer.innerHTML = '<p style="color: #ddd; text-align: center;">No gallery items available at this time.</p>';
          return;
        }
        
        // Build category buttons
        buildCategoryButtons(items);
        
        // Create gallery cards
        const galleryCards = items.map(createGalleryCard);
        
        // Sort items by category then title
        sortedProducts = galleryCards.sort((a, b) => {
          const catA = (a.dataset.category || '').toLowerCase();
          const catB = (b.dataset.category || '').toLowerCase();
          const titleA = (a.querySelector('.product-title')?.textContent || '').trim().toLowerCase();
          const titleB = (b.querySelector('.product-title')?.textContent || '').trim().toLowerCase();
          return catA.localeCompare(catB) || titleA.localeCompare(titleB);
        });
        
        // Initial render
        renderGallery('all');
        
      } catch (error) {
        console.error('Error loading gallery data:', error);
        productsContainer.innerHTML = '<p style="color: #ddd; text-align: center;">Failed to load gallery items. Please try again later.</p>';
      }
    }

    // Initialize on page load
    loadGalleryData();
  </script>
</body>
</html>
