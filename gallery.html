<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Gallery | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header>
    <h1>JGV3D Guitar Bodies</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="about.html">About Us</a>
      <a href="cart.html">Cart</a>
      <a href="usefullinks.html">Useful Links</a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <!-- Main Gallery Content -->
  <div class="container">
    <!-- Sidebar with filters -->
    <div class="sidebar">
      <h3>Categories</h3>
      <div class="categories">
        <button onclick="filterGallery('all')">All</button>
        <button onclick="filterGallery('telecaster')">Telecaster</button>
        <button onclick="filterGallery('stratocaster')">Stratocaster</button>
        <button onclick="filterGallery('jazzmaster')">Jazzmaster</button>
        <button onclick="filterGallery('other')">Other</button>
      </div>
    </div>

    <!-- Divider Line -->
    <div class="divider"></div>

    <!-- Gallery container -->
    <div class="products-container">
      <h2>Gallery</h2>
      <div class="products"></div>
    </div>
  </div>

  <script>
    /* ---------- CSV Parsing and Loading ---------- */
    let sortedProducts = [];
    const productsContainer = document.querySelector('.products');

    function parseCSV(text) {
      const lines = text.split('\n').map(line => line.trim()).filter(line => line);
      if (lines.length < 2) return [];
      const headers = lines[0].split(',').map(h => h.trim());
      const rows = [];
      for (let i = 1; i < lines.length; i++) {
        const values = lines[i].split(',').map(v => v.trim());
        if (values.length === headers.length) {
          const obj = {};
          headers.forEach((h, idx) => { obj[h] = values[idx]; });
          rows.push(obj);
        } else {
          console.warn('Skipping malformed CSV row:', lines[i]);
        }
      }
      return rows;
    }

    function createGalleryCard(item) {
      const card = document.createElement('div');
      card.className = 'product';
      card.dataset.category = item.category || '';
      card.style.display = 'block';

      card.innerHTML = `
        <img src="${item.img || ''}" alt="${item.title || 'Gallery Item'}">
        <div class="product-title">${item.title || ''}</div>
        <div class="product-price">${item.label || ''}</div>
      `;

      return card;
    }

    async function loadGallery() {
      try {
        const response = await fetch('data/gallery.csv?t=' + Date.now(), {
          cache: 'no-store'
        });
        if (!response.ok) throw new Error('Failed to load gallery.csv');
        const text = await response.text();
        const items = parseCSV(text);

        if (items.length === 0) {
          productsContainer.innerHTML = '<p style="color:#ddd;">No gallery items available.</p>';
          return;
        }

        const galleryCards = items.map(createGalleryCard);
        sortedProducts = galleryCards.sort((a, b) => {
          const catA = (a.dataset.category || '').toLowerCase();
          const catB = (b.dataset.category || '').toLowerCase();
          const titleA = (a.querySelector('.product-title')?.textContent || '').trim().toLowerCase();
          const titleB = (b.querySelector('.product-title')?.textContent || '').trim().toLowerCase();
          return catA.localeCompare(catB) || titleA.localeCompare(titleB);
        });

        renderGallery('all');
      } catch (error) {
        console.error('Error loading gallery:', error);
        productsContainer.innerHTML = '<p style="color:#ddd;">Failed to load gallery items. Please try again later.</p>';
      }
    }

    function renderGallery(category = 'all') {
      productsContainer.innerHTML = '';
      sortedProducts.forEach(card => {
        const match = category === 'all' || card.dataset.category === category;
        if (match) {
          card.style.display = 'block';
          productsContainer.appendChild(card);
        }
      });
    }

    function filterGallery(category) {
      renderGallery(category);
    }

    /* ---------- Sorting for categories ---------- */
    const categoriesContainer = document.querySelector('.categories');
    const categoryButtons = Array.from(categoriesContainer.querySelectorAll('button'));
    const [allButton, ...otherButtons] = categoryButtons;
    otherButtons.sort((a, b) =>
      a.textContent.trim().localeCompare(b.textContent.trim(), undefined, { sensitivity: 'base' })
    );
    categoriesContainer.innerHTML = '';
    categoriesContainer.appendChild(allButton);
    otherButtons.forEach(btn => categoriesContainer.appendChild(btn));

    // Load gallery items from CSV on page load
    loadGallery();
  </script>
</body>
</html>
