<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Your Orders | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Orders</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About Us</a>
      <a href="faq.html">FAQ</a>
      <a href="usefullinks.html">Useful Links</a>
      <a href="cart.html" class="mini-cart" id="mini-cart">
        Cart
        <span class="mini-cart-count" id="mini-cart-count">0</span>
      </a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <main class="cart-container">
    <h2>Your Orders</h2>
    <p class="order-page-note">Orders placed while signed in are saved to your account, so you can see them on any device. Only you and JGV3D can see them. Status updates are made by JGV3D.</p>
    <div id="orders-status" class="cart-status" role="status" aria-live="polite" hidden>
      <span id="orders-status-text"></span>
      <button type="button" class="cart-status-retry" id="orders-retry-btn" hidden>Retry</button>
    </div>
    <div id="orders-list" class="order-list" aria-live="polite"></div>
  </main>

  <script type="module">
    import { loadAccountData, ORDER_STATUSES, summarizeShipping, friendlyAccountError } from './account-data.js';

    const STATUS_CLASSES = {
      'In Queue': 'status-queued',
      'In Progress': 'status-in-progress',
      'Shipped': 'status-shipped',
      'Completed': 'status-completed'
    };

    const list = document.getElementById('orders-list');
    const statusEl = document.getElementById('orders-status');
    const statusTextEl = document.getElementById('orders-status-text');
    const retryBtn = document.getElementById('orders-retry-btn');
    let api = null;
    let currentUid = null;
    let epoch = 0;

    function formatPrice(num) {
      return `$${Number(num || 0).toFixed(2)}`;
    }

    function formatOrderDate(dateValue) {
      const parsed = new Date(dateValue);
      return Number.isNaN(parsed.getTime()) ? 'Date unavailable' : parsed.toLocaleString();
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getTitleParts(title) {
      const value = title || 'Item';
      const match = value.match(/^(.*?)\s*\((.*)\)$/);
      if (!match) {
        return { base: value, details: '' };
      }

      return {
        base: match[1].trim() || value,
        details: match[2].trim()
      };
    }

    function attachImageFallbacks(container) {
      container.querySelectorAll('img').forEach(img => {
        img.addEventListener('error', () => {
          img.src = 'images/placeholder.png';
        }, { once: true });
      });
    }

    function setStatus(text, { error = false, retry = false } = {}) {
      statusEl.hidden = !text;
      statusEl.className = `cart-status${error ? ' is-error' : ''}`;
      statusTextEl.textContent = text || '';
      retryBtn.hidden = !retry;
    }

    function renderSignedOut() {
      list.innerHTML = `
        <section class="order-empty-state">
          <h3>Sign in to see your orders</h3>
          <p>Orders are saved to your account. <a href="login.html">Sign in or create an account</a> to place and track orders.</p>
        </section>
      `;
    }

    function renderOrders(orders) {
      list.innerHTML = '';

      if (!orders.length) {
        list.innerHTML = `
          <section class="order-empty-state">
            <h3>No orders yet</h3>
            <p>Your completed checkouts will appear here once items move out of the cart.</p>
            <p><a href="shop.html">Browse the shop</a> to start your next build.</p>
          </section>
        `;
        return;
      }

      orders.forEach(order => {
        const items = order.items;
        const status = ORDER_STATUSES.includes(order.status) ? order.status : 'In Queue';
        const statusClass = STATUS_CLASSES[status] || 'status-queued';
        const itemCount = items.reduce((sum, item) => sum + item.qty, 0);
        const formattedDate = formatOrderDate(order.date);
        const orderDetailsHref = `order-details.html?id=${encodeURIComponent(order.docId)}`;
        const shipTo = summarizeShipping(order.shipping);
        const previewItems = items.slice(0, 2).map(item => {
          const parts = getTitleParts(item.title);
          const imagePath = item.img && item.img.trim() ? item.img : 'images/placeholder.png';
          return `
            <article class="order-preview-item">
              <img src="${escapeHTML(imagePath)}" alt="${escapeHTML(parts.base)}">
              <div class="order-preview-content">
                <h3>${escapeHTML(parts.base)}</h3>
                ${parts.details ? `<p class="order-item-options"><strong>Selected options:</strong> ${escapeHTML(parts.details)}</p>` : ''}
                <p class="order-meta">Qty ${item.qty} × ${formatPrice(item.price)}</p>
              </div>
              <div class="order-price">${formatPrice(item.qty * item.price)}</div>
            </article>
          `;
        }).join('');

        const extraCount = items.length - 2;
        const card = document.createElement('section');
        card.className = 'order-card';
        card.innerHTML = `
          <div class="order-header">
            <div>
              <div class="order-id">Order #${escapeHTML(order.id || 'Unknown')}</div>
              <div class="order-date">Placed ${escapeHTML(formattedDate)}</div>
            </div>
            <span class="order-status ${statusClass}">${escapeHTML(status)}</span>
          </div>

          <div class="order-summary-grid">
            <div class="order-summary-stat">
              <span class="order-summary-label">Items</span>
              <span class="order-summary-value">${itemCount}</span>
            </div>
            <div class="order-summary-stat">
              <span class="order-summary-label">Order Total</span>
              <span class="order-summary-value">${formatPrice(order.total)}</span>
            </div>
            <div class="order-summary-stat">
              <span class="order-summary-label">Current Stage</span>
              <span class="order-summary-value">${escapeHTML(status)}</span>
            </div>
          </div>

          ${shipTo ? `<p class="order-card-copy"><strong>Ship to:</strong> ${escapeHTML(shipTo)}</p>` : ''}

          <div class="order-preview-list">
            ${previewItems}
            ${extraCount > 0 ? `<p class="order-card-copy">+${extraCount} more ${extraCount === 1 ? 'item' : 'items'} in this order.</p>` : ''}
          </div>

          <div class="order-card-footer">
            <a class="order-detail-link" href="${escapeHTML(orderDetailsHref)}">View Order Details</a>
          </div>
        `;

        attachImageFallbacks(card);
        list.appendChild(card);
      });
    }

    async function loadOrders() {
      const myEpoch = ++epoch;
      const uid = currentUid;
      list.innerHTML = '';
      if (!uid) {
        setStatus('');
        renderSignedOut();
        return;
      }
      setStatus('Loading your orders…');
      try {
        const orders = await api.listOrders(uid);
        if (myEpoch !== epoch) return;
        setStatus('');
        renderOrders(orders);
      } catch (error) {
        if (myEpoch !== epoch) return;
        setStatus(`Couldn't load your orders. ${friendlyAccountError(error)}`, { error: true, retry: true });
      }
    }

    async function start() {
      setStatus('Loading your orders…');
      try {
        api = await loadAccountData();
      } catch (error) {
        setStatus('Couldn\'t connect to load your orders. Check your connection and try again.', { error: true, retry: true });
        return;
      }
      // Clear the list immediately on sign-out or account switch.
      api.onUserChanged(user => {
        currentUid = user ? user.id : null;
        loadOrders();
      });
    }

    retryBtn.addEventListener('click', () => {
      if (api) loadOrders();
      else start();
    });

    start();
  </script>
  <script type="module" src="mini-cart.js"></script>
  <script type="module" src="auth-navigation.js"></script>
</body>
</html>
