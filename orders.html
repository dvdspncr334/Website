<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Your Orders | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .order-card { background:#2a2a2a; border:1px solid #444; border-radius:8px; padding:16px; margin-bottom:20px; }
    .order-header { display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px; border-bottom:1px solid #444; padding-bottom:10px; margin-bottom:6px; }
    .order-id { color:#e67e22; font-weight:bold; font-size:1.1em; }
    .order-date { color:#aaa; font-size:0.9em; }
    .order-status { padding:5px 12px; border-radius:4px; font-size:0.8em; font-weight:bold; text-transform:uppercase; color:#fff; }
    .status-queued { background:#6c757d; }
    .status-in-progress { background:#e67e22; }
    .status-shipped { background:#17a2b8; }
    .status-completed { background:#28a745; }
    .order-options { display:flex; flex-wrap:wrap; gap:6px; margin:6px 0; }
    .order-option { background:#444; border:1px solid #555; border-radius:4px; padding:3px 8px; font-size:0.8em; color:#ddd; }
    .order-total { text-align:right; font-size:1.1em; color:#ff9800; margin-top:10px; }
    .order-empty { text-align:center; color:#ddd; margin:10px 0; }
    .order-empty a { color:#e67e22; }
  </style>
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>Orders</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About Us</a>
      <a href="usefullinks.html">Useful Links</a>
      <a href="cart.html" class="mini-cart" id="mini-cart">
        Cart
        <span class="mini-cart-count" id="mini-cart-count">0</span>
      </a>
      <!-- Orders link hidden (current page) -->
      <a href="login.html">Login</a>
    </div>
  </header>

  <!-- Orders Content -->
  <div class="cart-container">
    <h2>Your Orders</h2>
    <div id="orders-list"></div>
  </div>

  <script>
    const CART_KEY = 'jgv3d_cart';
    const ORDERS_KEY = 'jgv3d_orders';

    // Status values. Later a backend / printer integration can update
    // order.status and this page will reflect it automatically.
    const STATUS_CLASSES = {
      'In Queue': 'status-queued',
      'In Progress': 'status-in-progress',
      'Shipped': 'status-shipped',
      'Completed': 'status-completed'
    };

    function loadOrders() {
      try { return JSON.parse(localStorage.getItem(ORDERS_KEY)) || []; } catch (e) { return []; }
    }

    function formatPrice(num) { return `$${Number(num || 0).toFixed(2)}`; }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
    }

    // Split "Title (Right, HH, Black)" into base title + option chips.
    function parseTitle(title) {
      const t = title || 'Item';
      const match = t.match(/^(.*?)\s*\((.*)\)$/);
      if (!match) return { base: t, options: [] };
      return {
        base: match[1].trim(),
        options: match[2].split(',').map(s => s.trim()).filter(Boolean)
      };
    }

    function renderOrders() {
      const list = document.getElementById('orders-list');
      const orders = loadOrders().sort((a, b) => new Date(b.date) - new Date(a.date));
      list.innerHTML = '';

      if (orders.length === 0) {
        list.innerHTML = `<p class="order-empty">You have no orders yet. <a href="shop.html">Browse the shop</a>.</p>`;
        return;
      }

      orders.forEach(order => {
        const status = order.status || 'In Queue';
        const statusClass = STATUS_CLASSES[status] || 'status-queued';
        const card = document.createElement('div');
        card.className = 'order-card';

        const itemsHTML = (order.items || []).map(item => {
          const parsed = parseTitle(item.title);
          const qty = Number(item.qty) || 1;
          const price = Number(item.price) || 0;
          const img = item.img && String(item.img).trim() ? item.img : 'images/placeholder.png';
          const chips = parsed.options.map(o => `<span class="order-option">${escapeHTML(o)}</span>`).join('');
          return `
            <div class="cart-item">
              <img src="${escapeHTML(img)}" alt="${escapeHTML(parsed.base)}" onerror="this.src='images/placeholder.png'">
              <div class="cart-item-details">
                <h4>${escapeHTML(parsed.base)}</h4>
                ${chips ? `<div class="order-options">${chips}</div>` : ''}
                <p>Qty: ${qty} &times; ${formatPrice(price)}</p>
              </div>
              <div class="cart-item-price">${formatPrice(qty * price)}</div>
            </div>`;
        }).join('');

        card.innerHTML = `
          <div class="order-header">
            <div>
              <div class="order-id">Order #${escapeHTML(order.id)}</div>
              <div class="order-date">Placed ${new Date(order.date).toLocaleString()}</div>
            </div>
            <span class="order-status ${statusClass}">${escapeHTML(status)}</span>
          </div>
          ${itemsHTML}
          <div class="order-total">Order Total: ${formatPrice(order.total)}</div>
        `;
        list.appendChild(card);
      });
    }

    function updateMiniCart() {
      try {
        const cart = JSON.parse(localStorage.getItem(CART_KEY)) || [];
        const totalItems = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
        const el = document.getElementById('mini-cart-count');
        if (el) { el.textContent = totalItems; el.style.display = totalItems > 0 ? 'flex' : 'none'; }
      } catch (e) {}
    }

    // Keep in sync if orders/cart change in another tab
    window.addEventListener('storage', (e) => {
      if (e.key === ORDERS_KEY) renderOrders();
      if (e.key === CART_KEY) updateMiniCart();
    });

    renderOrders();
    updateMiniCart();
  </script>
</body>
</html>
