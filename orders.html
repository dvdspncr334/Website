  <script src="order-utils.js"></script>
  <script>
    const CART_KEY = 'jgv3d_cart';
    const ORDERS_KEY = 'jgv3d_orders';
    const ORDER_STATUSES = ['In Queue', 'In Progress', 'Shipped', 'Completed'];
    const STATUS_CLASSES = {
      'In Queue': 'status-queued',
      'In Progress': 'status-in-progress',
      'Shipped': 'status-shipped',
      'Completed': 'status-completed'
    };

    function loadOrders() {
      try {
        const parsed = JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
        const { orders, didChange } = window.JGV3DOrderUtils.hydrateOrdersWithDetailKeys(parsed);
        if (didChange) {
          localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
        }
        return orders;
      } catch (e) {
        return [];
      }
    }

    function saveOrders(orders) {
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
    }

    function normalizeItem(item) {
      return {
        id: item && item.id ? item.id : '',
        title: item && item.title ? item.title : 'Item',
        img: item && item.img ? item.img : 'images/placeholder.png',
        qty: Number(item && item.qty) > 0 ? Number(item.qty) : 1,
        price: Number(item && item.price) || 0
      };
    }

    function formatPrice(num) {
      return `$${Number(num || 0).toFixed(2)}`;
    }

    function formatOrderDate(dateValue) {
      const parsed = new Date(dateValue);
      return Number.isNaN(parsed.getTime()) ? 'Date unavailable' : parsed.toLocaleString();
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }
