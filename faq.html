<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>FAQ | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>FAQ</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About Us</a>
      <!-- FAQ link hidden (current page) -->
      <a href="usefullinks.html">Useful Links</a>
      <a href="cart.html" class="mini-cart" id="mini-cart">
        Cart
        <span class="mini-cart-count" id="mini-cart-count">0</span>
      </a>
      <a href="orders.html">My Orders</a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <div class="faq-container">
    <h2>Frequently Asked Questions</h2>
    <div class="faq-list" id="faq-list" aria-live="polite">
      <p>Loading FAQs...</p>
    </div>
  </div>

  <script>
    function updateMiniCart() {
      try {
        const cart = JSON.parse(localStorage.getItem('jgv3d_cart')) || [];
        const totalItems = cart.reduce((sum, item) => sum + (Number(item.qty) || 0), 0);
        const miniCartCount = document.getElementById('mini-cart-count');
        if (miniCartCount) {
          miniCartCount.textContent = totalItems;
          miniCartCount.style.display = totalItems > 0 ? 'flex' : 'none';
        }
      } catch (e) {}
    }

    function parseCSV(text) {
      const rows = [];
      let row = [];
      let cell = '';
      let inQuotes = false;

      for (let i = 0; i < text.length; i++) {
        const char = text[i];
        const nextChar = text[i + 1];

        if (char === '"') {
          if (inQuotes && nextChar === '"') {
            cell += '"';
            i++;
          } else {
            inQuotes = !inQuotes;
          }
        } else if (char === ',' && !inQuotes) {
          row.push(cell);
          cell = '';
        } else if ((char === '\n' || char === '\r') && !inQuotes) {
          if (char === '\r' && nextChar === '\n') i++;
          row.push(cell);
          cell = '';

          if (row.some(value => value !== '')) {
            rows.push(row);
          }
          row = [];
        } else {
          cell += char;
        }
      }

      if (cell.length > 0 || row.length > 0) {
        row.push(cell);
        if (row.some(value => value !== '')) {
          rows.push(row);
        }
      }

      if (rows.length < 2) return [];

      const headers = rows[0].map((header) => header.trim().toLowerCase());
      return rows.slice(1).map((values) => {
        const item = {};
        headers.forEach((header, index) => {
          item[header] = values[index] || '';
        });
        return item;
      });
    }

    function toBoolean(value) {
      return String(value).toLowerCase() === 'true' || String(value) === '1';
    }

    function renderFAQs(items) {
      const faqList = document.getElementById('faq-list');
      faqList.innerHTML = '';

      const hasExplicitOpenRow = items.some(item => toBoolean(item.open));
      let renderedCount = 0;

      items.forEach((item) => {
        const question = (item.question || '').trim();
        const answer = (item.answer || '').trim();
        if (!question || !answer) return;

        const details = document.createElement('details');
        details.className = 'faq-item';

        if (toBoolean(item.open) || (!hasExplicitOpenRow && renderedCount === 0)) {
          details.open = true;
        }

        const summary = document.createElement('summary');
        summary.textContent = question;

        const paragraph = document.createElement('p');
        paragraph.textContent = answer;

        details.appendChild(summary);
        details.appendChild(paragraph);
        faqList.appendChild(details);
        renderedCount++;
      });

      if (renderedCount === 0) {
        faqList.innerHTML = '<p role="status">No FAQ entries are available right now.</p>';
      }
    }

    async function loadFAQs() {
      const faqList = document.getElementById('faq-list');

      try {
        const response = await fetch('data/faq.csv', { cache: 'no-store' });
        if (!response.ok) {
          throw new Error('Failed to load FAQ CSV');
        }

        const text = await response.text();
        const faqItems = parseCSV(text);
        renderFAQs(faqItems);
      } catch (error) {
        console.error('Error loading FAQ data:', error);
        faqList.innerHTML = '<p role="alert">Failed to load FAQ entries. Please try again later.</p>';
      }
    }

    updateMiniCart();
    loadFAQs();
  </script>
</body>
</html>
