<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Order Details | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="header">
    <h1>Order Details</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About Us</a>
      <a href="faq.html">FAQ</a>
      <a href="usefullinks.html">Useful Links</a>
      <a href="cart.html" class="mini-cart" id="mini-cart">
        Cart
        <span class="mini-cart-count" id="mini-cart-count">0</span>
      </a>
      <a href="orders.html">My Orders</a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <main class="cart-container">
    <a class="order-back-link" href="orders.html">← Back to Orders</a>
    <div id="order-details-root" class="order-details-root"></div>
  </main>

  <script type="module">
    import { loadAccountData, ORDER_STATUSES, formatShippingLines, friendlyAccountError } from './account-data.js';

    const STATUS_CLASSES = {
      'In Queue': 'status-queued',
      'In Progress': 'status-in-progress',
      'Shipped': 'status-shipped',
      'Completed': 'status-completed',
      'Cancelled': 'status-cancelled'
    };

    function formatPrice(num) {
      return `$${Number(num || 0).toFixed(2)}`;
    }

    function formatOrderDate(dateValue) {
      const parsed = new Date(dateValue);
      return Number.isNaN(parsed.getTime()) ? 'Date unavailable' : parsed.toLocaleString();
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function getTitleParts(title) {
      const value = title || 'Item';
      const match = value.match(/^(.*?)\s*\((.*)\)$/);
      if (!match) {
        return { base: value, details: '' };
      }

      return {
        base: match[1].trim() || value,
        details: match[2].trim()
      };
    }

    function attachImageFallbacks(container) {
      container.querySelectorAll('img').forEach(img => {
        img.addEventListener('error', () => {
          img.src = 'images/placeholder.png';
        }, { once: true });
      });
    }

    function getOrderReference() {
      const params = new URLSearchParams(window.location.search);
      return params.get('id') || '';
    }

    function renderMessage(title, html) {
      const root = document.getElementById('order-details-root');
      root.innerHTML = `
        <section class="order-not-found">
          <h2>${escapeHTML(title)}</h2>
          ${html}
        </section>
      `;
    }

    function renderNotFound(orderId) {
      const root = document.getElementById('order-details-root');
      root.innerHTML = `
        <section class="order-not-found">
          <h2>Order not found</h2>
          <p>We could not find an order matching <strong>${escapeHTML(orderId || 'the provided link')}</strong>.</p>
          <p>Please return to <a href="orders.html">My Orders</a> and choose another order.</p>
        </section>
      `;
    }

    function renderOrder(order) {
      const root = document.getElementById('order-details-root');
      const items = order.items;
      const status = ORDER_STATUSES.includes(order.status) ? order.status : 'In Queue';
      const statusClass = STATUS_CLASSES[status] || 'status-queued';
      const itemCount = items.reduce((sum, item) => sum + item.qty, 0);
      const orderTotal = order.total;
      const formattedDate = formatOrderDate(order.date);
      const shippingLines = formatShippingLines(order.shipping);
      const deliveryNotes = order.shipping.deliveryNotes;
      const currentIndex = ORDER_STATUSES.indexOf(status);

      const progressMarkup = ORDER_STATUSES.filter(step => step !== 'Cancelled').map((step, index) => {
        const classes = ['order-progress-step'];
        if (status !== 'Cancelled' && index < currentIndex) {
          classes.push('is-complete');
        } else if (status !== 'Cancelled' && index === currentIndex) {
          classes.push('is-active');
        }
        return `<li class="${classes.join(' ')}" ${index === currentIndex ? 'aria-current="step"' : ''}>${escapeHTML(step)}<span>${index < currentIndex ? 'Completed stage' : index === currentIndex ? 'Current status' : 'Upcoming stage'}</span></li>`;
      }).join('');

      const itemsMarkup = items.map(item => {
        const parts = getTitleParts(item.title);
        const imagePath = item.img && item.img.trim() ? item.img : 'images/placeholder.png';
        return `
          <article class="order-detail-item">
            <img src="${escapeHTML(imagePath)}" alt="${escapeHTML(parts.base)}">
            <div class="order-item-content">
              <h3>${escapeHTML(parts.base)}</h3>
              <p class="order-item-meta"><strong>Full item:</strong> ${escapeHTML(item.title)}</p>
              ${parts.details ? `<p class="order-item-options"><strong>Selected options:</strong> ${escapeHTML(parts.details)}</p>` : ''}
              <p class="order-item-meta"><strong>Quantity:</strong> ${item.qty}</p>
              <p class="order-item-meta"><strong>Unit price:</strong> ${formatPrice(item.price)}</p>
            </div>
            <div class="order-item-side">
              <span class="order-status ${statusClass}">${escapeHTML(status)}</span>
              <div class="order-item-subtotal">${formatPrice(item.qty * item.price)}</div>
            </div>
          </article>
        `;
      }).join('');

      root.innerHTML = `
        <section class="order-detail-shell">
          <div class="order-detail-topbar">
            <div>
              <div class="order-id">Order #${escapeHTML(order.id || 'Unknown')}</div>
              <div class="order-date">Placed ${escapeHTML(formattedDate)}</div>
            </div>
            <span class="order-status ${statusClass}">${escapeHTML(status)}</span>
          </div>

          <div class="order-detail-summary">
            <div class="order-summary-stat">
              <span class="order-summary-label">Order Number</span>
              <span class="order-summary-value">${escapeHTML(order.id || 'Unknown')}</span>
            </div>
            <div class="order-summary-stat">
              <span class="order-summary-label">Placed Date</span>
              <span class="order-summary-value">${escapeHTML(formattedDate)}</span>
            </div>
            <div class="order-summary-stat">
              <span class="order-summary-label">Items</span>
              <span class="order-summary-value">${itemCount}</span>
            </div>
            <div class="order-summary-stat">
              <span class="order-summary-label">Total</span>
              <span class="order-summary-value">${formatPrice(orderTotal)}</span>
            </div>
          </div>

          <section class="order-progress" aria-label="Order progress">
            <h3>${status === 'Cancelled' ? 'Order Cancelled' : 'Order Progress'}</h3>
            ${status === 'Cancelled'
              ? `<p>This order was cancelled.${order.cancellationReason ? ` Reason: ${escapeHTML(order.cancellationReason)}` : ''} Cancellation records status only; it does not process a refund.</p>`
              : `<ol class="order-progress-track">${progressMarkup}</ol>`}
          </section>

          <section class="order-detail-section">
            <h3>Shipping address</h3>
            ${shippingLines.length
              ? `<address class="shipping-address">${shippingLines.map(escapeHTML).join('<br>')}</address>`
              : '<p class="order-item-meta">No shipping address was saved with this order.</p>'}
            ${deliveryNotes ? `<p class="order-item-meta"><strong>Delivery notes:</strong> ${escapeHTML(deliveryNotes)}</p>` : ''}
            ${order.notes ? `<p class="order-item-meta"><strong>Order notes:</strong> ${escapeHTML(order.notes)}</p>` : ''}
          </section>

          <section class="order-detail-section">
            <h3>Items in this order</h3>
            <div class="order-detail-items">${itemsMarkup}</div>
            <div class="order-total-row">Order Total: ${formatPrice(orderTotal)}</div>
          </section>
        </section>
      `;

      attachImageFallbacks(root);
    }

    let api = null;
    let epoch = 0;
    let currentUid = null;
    let unsubscribeOrder = null;

    async function renderOrderDetails(uid) {
      const myEpoch = ++epoch;
      if (unsubscribeOrder) unsubscribeOrder();
      unsubscribeOrder = null;
      const orderId = getOrderReference();
      if (!orderId) {
        renderNotFound('missing order reference');
        return;
      }
      if (!uid) {
        renderMessage('Sign in to see this order', '<p>Orders are saved to your account. <a href="login.html">Sign in</a> with the account that placed this order.</p>');
        return;
      }
      renderMessage('Loading order…', '');
      try {
        unsubscribeOrder = api.subscribeOrder(uid, orderId, order => {
          if (myEpoch !== epoch) return;
          if (!order) renderNotFound(orderId);
          else renderOrder(order);
        }, error => {
          if (myEpoch !== epoch) return;
          renderMessage('Couldn\'t load this order', `<p>${escapeHTML(friendlyAccountError(error))}</p><p><button type="button" class="cart-status-retry" id="order-retry-btn">Retry</button></p>`);
          document.getElementById('order-retry-btn').addEventListener('click', () => renderOrderDetails(currentUid));
        });
      } catch (error) {
        if (myEpoch !== epoch) return;
        renderMessage('Couldn\'t load this order', `<p>${escapeHTML(friendlyAccountError(error))}</p><p><button type="button" class="cart-status-retry" id="order-retry-btn">Retry</button></p>`);
        document.getElementById('order-retry-btn').addEventListener('click', () => renderOrderDetails(currentUid));
      }
    }

    async function start() {
      renderMessage('Loading order…', '');
      try {
        api = await loadAccountData();
      } catch (error) {
        renderMessage('Couldn\'t load this order', '<p>Check your connection and try again.</p><p><button type="button" class="cart-status-retry" id="order-retry-btn">Retry</button></p>');
        document.getElementById('order-retry-btn').addEventListener('click', start);
        return;
      }
      // Re-render (and drop the previous account's order) on any sign-in change.
      api.onUserChanged(user => {
        currentUid = user ? user.id : null;
        renderOrderDetails(currentUid);
      });
    }

    start();
  </script>
  <script type="module" src="mini-cart.js"></script>
  <script type="module" src="auth-navigation.js"></script>
</body>
</html>
