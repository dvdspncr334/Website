<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Your Cart | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>Cart</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About Us</a>
      <a href="usefullinks.html">Useful Links</a>
      <!-- Cart link hidden (current page) -->
      <a href="orders.html">My Orders</a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <!-- Cart Content -->
  <div class="cart-container">
    <h2>Your Cart</h2>
    <div id="cart-summary"></div>
    <div id="cart-selection-controls" class="cart-selection-controls">
      <label for="select-all-checkbox">
        <input type="checkbox" id="select-all-checkbox" aria-label="Select all cart items">
        Select All
      </label>
      <span id="cart-selection-message" class="cart-selection-message" aria-live="polite"></span>
    </div>
    <div id="cart-items"></div>

    <div id="cart-total" style="margin-top:16px; font-size:1.1em; color:#ff9800;"></div>

    <button type="button" class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
  </div>

  <script src="order-utils.js"></script>
  <script>
    const CART_KEY = 'jgv3d_cart';
    const ORDERS_KEY = 'jgv3d_orders';
    const CART_SELECTION_KEY = 'jgv3d_cart_selection';

    const cartItemsEl = document.getElementById('cart-items');
    const cartSummaryEl = document.getElementById('cart-summary');
    const cartSelectionControlsEl = document.getElementById('cart-selection-controls');
    const selectAllCheckbox = document.getElementById('select-all-checkbox');
    const cartSelectionMessageEl = document.getElementById('cart-selection-message');
    const cartTotalEl = document.getElementById('cart-total');
    const checkoutBtn = document.getElementById('checkout-btn');

    function loadCart() {
      try {
        return JSON.parse(localStorage.getItem(CART_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveCart(cart) {
      localStorage.setItem(CART_KEY, JSON.stringify(cart));
    }

    function loadOrders() {
      try {
        return JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveOrders(orders) {
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
    }

    function loadCartSelection() {
      try {
        const parsed = JSON.parse(localStorage.getItem(CART_SELECTION_KEY));
        return Array.isArray(parsed) ? parsed.map(id => String(id)) : null;
      } catch (e) {
        return null;
      }
    }

    function saveCartSelection(selectionIds) {
      localStorage.setItem(CART_SELECTION_KEY, JSON.stringify(selectionIds));
    }

    function formatPrice(num) {
      return `$${num.toFixed(2)}`;
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseCartTitle(title) {
      const match = title.match(/^(.*?)\s*\(Custom Color:\s*(.*?)\)$/);
      if (match) {
        return {
          baseTitle: match[1].trim(),
          customNote: match[2].trim(),
          isCustomOrder: true
        };
      }

      return {
        baseTitle: title || 'Item',
        customNote: '',
        isCustomOrder: false
      };
    }

    function normalizeCartItem(item) {
      const normalized = item || {};
      normalized.img = normalized.img || 'images/placeholder.png';
      normalized.title = normalized.title || 'Item';
      normalized.qty = Number(normalized.qty) > 0 ? Number(normalized.qty) : 1;
      normalized.price = Number(normalized.price) || 0;
      return normalized;
    }

    function renderCartSummary(cart) {
      const customOrderCount = cart.reduce((count, item) => {
        const parsed = parseCartTitle(item.title || 'Item');
        return count + (parsed.isCustomOrder ? item.qty : 0);
      }, 0);

      if (customOrderCount > 0) {
        const label = customOrderCount === 1 ? 'custom-order item' : 'custom-order items';
        cartSummaryEl.innerHTML = `<div class="cart-summary-card">Contains <strong>${customOrderCount}</strong> ${label}. Review custom notes before checkout.</div>`;
      } else {
        cartSummaryEl.innerHTML = '';
      }
    }

    function getSelectionForCart(cart) {
      const cartIds = cart.map(item => String(item.id));
      const storedSelection = loadCartSelection();
      const selectedIds = storedSelection === null
        ? cartIds
        : cartIds.filter(id => storedSelection.includes(id));
      saveCartSelection(selectedIds);
      return new Set(selectedIds);
    }

    function updateSelectAllState(cart, selectedIds) {
      const allSelected = cart.length > 0 && cart.every(item => selectedIds.has(String(item.id)));
      const anySelected = cart.some(item => selectedIds.has(String(item.id)));
      selectAllCheckbox.checked = allSelected;
      selectAllCheckbox.indeterminate = anySelected && !allSelected;
    }

    function updateCheckoutState(selectedCount) {
      const hasSelectedItems = selectedCount > 0;
      checkoutBtn.classList.toggle('is-disabled', !hasSelectedItems);
      checkoutBtn.setAttribute('aria-disabled', hasSelectedItems ? 'false' : 'true');
      checkoutBtn.disabled = !hasSelectedItems;
      if (hasSelectedItems) {
        cartSelectionMessageEl.textContent = '';
      }
    }

    function renderCart() {
      const cart = loadCart().map(item => normalizeCartItem(item));

      // Sort alphabetically by title
      cart.sort((a, b) => (a.title || '').toLowerCase().localeCompare((b.title || '').toLowerCase()));

      cartItemsEl.innerHTML = '';
      cartSummaryEl.innerHTML = '';
      cartSelectionMessageEl.textContent = '';

      if (cart.length === 0) {
        cartItemsEl.innerHTML = `<p style="text-align:center; color:#ddd; margin:10px 0;">Your cart is empty.</p>`;
        cartTotalEl.textContent = '';
        cartSelectionControlsEl.style.display = 'none';
        checkoutBtn.style.display = 'none';
        return;
      } else {
        cartSelectionControlsEl.style.display = 'flex';
        checkoutBtn.style.display = 'block';
      }

      renderCartSummary(cart);
      const selectedIds = getSelectionForCart(cart);
      updateSelectAllState(cart, selectedIds);

      let selectedTotal = 0;
      let selectedItemCount = 0;

      cart.forEach((item, itemIndex) => {
        const subtotal = item.price * item.qty;
        const itemId = String(item.id);
        const isSelected = selectedIds.has(itemId);
        if (isSelected) {
          selectedTotal += subtotal;
          selectedItemCount += item.qty;
        }
        const parsedTitle = parseCartTitle(item.title || 'Item');
        const safeBaseTitle = escapeHTML(parsedTitle.baseTitle || 'Item');
        const safeCustomNote = escapeHTML(parsedTitle.customNote || '');
        const itemImage = item.img && item.img.trim() ? item.img : 'images/placeholder.png';
        const safeItemImage = escapeHTML(itemImage);
        const titleId = `cart-item-title-${itemIndex}`;

        const wrapper = document.createElement('div');
        wrapper.className = 'cart-item';

        wrapper.innerHTML = `
          <div class="cart-item-select">
            <input type="checkbox" class="cart-item-checkbox" ${isSelected ? 'checked' : ''} aria-labelledby="${titleId}">
          </div>
          <img src="${safeItemImage}" alt="${safeBaseTitle}" onerror="this.src='images/placeholder.png'">
          <div class="cart-item-details">
            <div class="cart-item-header-row">
              <h4 id="${titleId}">${safeBaseTitle}</h4>
              ${parsedTitle.isCustomOrder ? '<span class="custom-order-badge">Custom Order</span>' : ''}
            </div>
            ${safeCustomNote ? `<p class="cart-item-note"><strong>Custom Color / Notes:</strong> ${safeCustomNote}</p>` : ''}
            <div class="qty-control" style="justify-content:flex-start; gap:8px; margin-top:6px;">
              <button class="qty-btn minus" aria-label="Decrease quantity">−</button>
              <span class="qty-value">${item.qty}</span>
              <button class="qty-btn plus" aria-label="Increase quantity">+</button>
            </div>
          </div>
          <div class="cart-item-price">${formatPrice(subtotal)}</div>
          <button class="remove-btn">Remove</button>
        `;

        const minus = wrapper.querySelector('.qty-btn.minus');
        const plus = wrapper.querySelector('.qty-btn.plus');
        const qtyEl = wrapper.querySelector('.qty-value');
        const priceEl = wrapper.querySelector('.cart-item-price');
        const removeBtn = wrapper.querySelector('.remove-btn');
        const itemCheckbox = wrapper.querySelector('.cart-item-checkbox');

        itemCheckbox.addEventListener('change', () => {
          if (itemCheckbox.checked) {
            selectedIds.add(itemId);
          } else {
            selectedIds.delete(itemId);
          }
          saveCartSelection(Array.from(selectedIds));
          renderCart();
        });

        minus.addEventListener('click', () => {
          const cartData = loadCart().map(entry => normalizeCartItem(entry));
          const entry = cartData.find(x => x.id === item.id);
          if (!entry) return;
          entry.qty = Math.max(1, Number(entry.qty) - 1);
          entry.img = item.img && item.img.trim() ? item.img : entry.img || 'images/placeholder.png';
          saveCart(cartData);
          qtyEl.textContent = entry.qty;
          priceEl.textContent = formatPrice(entry.qty * entry.price);
          renderCart();
        });

        plus.addEventListener('click', () => {
          const cartData = loadCart().map(entry => normalizeCartItem(entry));
          const entry = cartData.find(x => x.id === item.id);
          if (!entry) return;
          entry.qty += 1;
          entry.img = item.img && item.img.trim() ? item.img : entry.img || 'images/placeholder.png';
          saveCart(cartData);
          qtyEl.textContent = entry.qty;
          priceEl.textContent = formatPrice(entry.qty * entry.price);
          renderCart();
        });

        removeBtn.addEventListener('click', () => {
          const cartData = loadCart().filter(x => x.id !== item.id);
          selectedIds.delete(itemId);
          saveCartSelection(Array.from(selectedIds));
          saveCart(cartData);
          renderCart();
        });

        cartItemsEl.appendChild(wrapper);
      });

      cartTotalEl.textContent = `Total: ${formatPrice(selectedTotal)} • ${selectedItemCount} selected`;
      updateCheckoutState(selectedItemCount);
    }

    // Checkout: move all cart items into a new queued order, clear the cart,
    // then send the user to the Orders page.
    checkoutBtn.addEventListener('click', () => {
      const cart = loadCart().map(item => normalizeCartItem(item));
      if (cart.length === 0) return;
      const selectedIds = getSelectionForCart(cart);
      const selectedItems = cart.filter(item => selectedIds.has(String(item.id)));
      if (selectedItems.length === 0) {
        cartSelectionMessageEl.textContent = 'Select at least one item to checkout.';
        updateCheckoutState(0);
        return;
      }

      const total = selectedItems.reduce((sum, item) => sum + item.price * item.qty, 0);
      const now = new Date();
      const order = {
        id: 'JGV-' + now.getTime().toString().slice(-8),
        detailKey: window.JGV3DOrderUtils.createOrderDetailKey(),
        date: now.toISOString(),
        status: 'In Queue',
        items: selectedItems.map(item => ({
          id: item.id,
          title: item.title,
          img: item.img,
          qty: item.qty,
          price: item.price
        })),
        total: total
      };

      const orders = loadOrders();
      orders.push(order);
      saveOrders(orders);
      const remainingCartItems = cart.filter(item => !selectedIds.has(String(item.id)));
      saveCart(remainingCartItems);
      const remainingSelection = Array.from(selectedIds).filter(id =>
        remainingCartItems.some(item => String(item.id) === id)
      );
      saveCartSelection(remainingSelection);

      window.location.href = 'orders.html';
    });

    selectAllCheckbox.addEventListener('change', () => {
      const cart = loadCart().map(item => normalizeCartItem(item));
      const selectedIds = selectAllCheckbox.checked ? cart.map(item => String(item.id)) : [];
      saveCartSelection(selectedIds);
      renderCart();
    });

    // Update mini-cart count
    function updateMiniCart() {
      const cart = loadCart().map(item => normalizeCartItem(item));
      const totalItems = cart.reduce((sum, item) => sum + item.qty, 0);
      const miniCartCount = document.getElementById('mini-cart-count');
      if (miniCartCount) {
        miniCartCount.textContent = totalItems;
        miniCartCount.style.display = totalItems > 0 ? 'flex' : 'none';
      }
    }

    // Initial render
    renderCart();
    updateMiniCart();
  </script>
</body>
</html>
