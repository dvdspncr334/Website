<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <link rel="icon" type="image/x-icon" href="images/favicon.ico">
  <title>Your Cart | JGV3D Guitar Bodies</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Header -->
  <header class="header">
    <h1>Cart</h1>
    <div class="header-buttons">
      <a href="index.html">Home</a>
      <a href="shop.html">Shop</a>
      <a href="gallery.html">Gallery</a>
      <a href="about.html">About Us</a>
      <a href="usefullinks.html">Useful Links</a>
      <!-- Cart link hidden (current page) -->
      <a href="orders.html">My Orders</a>
      <a href="login.html">Login</a>
    </div>
  </header>

  <!-- Cart Content -->
  <div class="cart-container">
    <h2>Your Cart</h2>
    <div id="cart-status" class="cart-status" role="status" aria-live="polite" hidden>
      <span id="cart-status-text"></span>
      <button type="button" class="cart-status-retry" id="cart-retry-btn" hidden>Retry</button>
    </div>
    <div id="cart-summary"></div>
    <div id="cart-selection-controls" class="cart-selection-controls">
      <label for="select-all-checkbox">
        <input type="checkbox" id="select-all-checkbox" aria-label="Select all cart items">
        Select All
      </label>
      <span id="cart-selection-message" class="cart-selection-message" aria-live="polite"></span>
    </div>
    <div id="cart-items"></div>

    <div id="cart-total" style="margin-top:16px; font-size:1.1em; color:#ff9800;"></div>

    <button type="button" class="checkout-btn" id="checkout-btn">Proceed to Checkout</button>
    <p class="cart-demo-note" id="cart-demo-note">Checkout creates a demo order that is saved only in this browser. Orders are not linked to your account.</p>
  </div>

  <script src="order-utils.js"></script>
  <script type="module" src="auth-navigation.js"></script>
  <script type="module">
    import { cart } from './cart-service.js';

    const ORDERS_KEY = 'jgv3d_orders';

    const cartStatusEl = document.getElementById('cart-status');
    const cartStatusTextEl = document.getElementById('cart-status-text');
    const cartRetryBtn = document.getElementById('cart-retry-btn');
    const cartItemsEl = document.getElementById('cart-items');
    const cartSummaryEl = document.getElementById('cart-summary');
    const cartSelectionControlsEl = document.getElementById('cart-selection-controls');
    const selectAllCheckbox = document.getElementById('select-all-checkbox');
    const cartSelectionMessageEl = document.getElementById('cart-selection-message');
    const cartTotalEl = document.getElementById('cart-total');
    const checkoutBtn = document.getElementById('checkout-btn');

    let cartState = cart.getState();
    let checkoutInProgress = false;
    let actionMessage = '';

    function loadOrders() {
      try {
        return JSON.parse(localStorage.getItem(ORDERS_KEY)) || [];
      } catch (e) {
        return [];
      }
    }

    function saveOrders(orders) {
      localStorage.setItem(ORDERS_KEY, JSON.stringify(orders));
    }

    function formatPrice(num) {
      return `$${num.toFixed(2)}`;
    }

    function escapeHTML(str) {
      return String(str || '')
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    function parseCartTitle(title) {
      const match = title.match(/^(.*?)\s*\(Custom Color:\s*(.*?)\)$/);
      if (match) {
        return {
          baseTitle: match[1].trim(),
          customNote: match[2].trim(),
          isCustomOrder: true
        };
      }

      return {
        baseTitle: title || 'Item',
        customNote: '',
        isCustomOrder: false
      };
    }

    function renderStatus(state) {
      let text = '';
      let tone = '';
      if (state.status === 'loading') {
        text = state.scope === 'account' ? 'Loading your account cart…' : 'Loading your cart…';
      } else if (state.status === 'offline') {
        text = state.hasData
          ? 'You\'re offline. Showing your account cart as last loaded; changes are paused until you reconnect.'
          : 'You\'re offline. Your account cart will load when the connection returns.';
      } else if (state.error) {
        text = state.error.message;
        tone = 'is-error';
      } else if (state.saving) {
        text = 'Saving changes to your account cart…';
      } else if (state.scope === 'account') {
        text = 'Signed in: this is your account cart. All changes are saved to your account.';
        tone = 'is-saved';
      } else if (state.scope === 'guest') {
        text = 'Guest cart: saved in this browser only. Signing in shows your account\'s own cart instead.';
      }
      if (state.notice) text = text ? `${text} ${state.notice}` : state.notice;
      if (actionMessage) {
        text = actionMessage;
        tone = 'is-error';
      }
      cartStatusEl.hidden = !text;
      cartStatusEl.className = `cart-status ${tone}`.trim();
      cartStatusTextEl.textContent = text;
      cartRetryBtn.hidden = !(state.canRetry && state.error && !actionMessage);
    }

    function renderCartSummary(items) {
      const customOrderCount = items.reduce((count, item) => {
        const parsed = parseCartTitle(item.title || 'Item');
        return count + (parsed.isCustomOrder ? item.qty : 0);
      }, 0);

      if (customOrderCount > 0) {
        const label = customOrderCount === 1 ? 'custom-order item' : 'custom-order items';
        cartSummaryEl.innerHTML = `<div class="cart-summary-card">Contains <strong>${customOrderCount}</strong> ${label}. Review custom notes before checkout.</div>`;
      } else {
        cartSummaryEl.innerHTML = '';
      }
    }

    // Keeps the existing behaviour: the stored selection is pruned to items
    // that are still in the cart each time the cart is shown.
    function getSelectionForCart() {
      const selectedIds = cart.getSelection();
      if (cartState.canMutate) cart.setSelection(selectedIds);
      return selectedIds;
    }

    function updateSelectAllState(items, selectedIds) {
      const allSelected = items.length > 0 && items.every(item => selectedIds.has(String(item.id)));
      const anySelected = items.some(item => selectedIds.has(String(item.id)));
      selectAllCheckbox.checked = allSelected;
      selectAllCheckbox.indeterminate = anySelected && !allSelected;
    }

    function updateCheckoutState(selectedCount) {
      const canCheckout = selectedCount > 0 && cartState.canMutate && !cartState.saving && !checkoutInProgress;
      checkoutBtn.classList.toggle('is-disabled', !canCheckout);
      checkoutBtn.setAttribute('aria-disabled', canCheckout ? 'false' : 'true');
      checkoutBtn.disabled = !canCheckout;
      if (selectedCount > 0) {
        cartSelectionMessageEl.textContent = '';
      }
    }

    async function runCartAction(action) {
      actionMessage = '';
      try {
        await action();
      } catch (error) {
        // Save failures also show in the status bar (with Retry) via the store.
        if (error && (error.code === 'cart-full' || error.code === 'invalid-item' || error.code === 'not-ready' || error.code === 'offline' || error.code === 'stale-scope')) {
          actionMessage = error.message;
          renderCart();
        }
      }
    }

    function renderCart() {
      const state = cartState;
      renderStatus(state);
      const items = state.items.slice();
      const canEdit = state.canMutate && !checkoutInProgress;

      // Sort alphabetically by title
      items.sort((a, b) => (a.title || '').toLowerCase().localeCompare((b.title || '').toLowerCase()));

      cartItemsEl.innerHTML = '';
      cartSummaryEl.innerHTML = '';
      cartSelectionMessageEl.textContent = '';

      if (!state.hasData) {
        // Never show "empty" while the cart for this sign-in state isn't loaded.
        cartTotalEl.textContent = '';
        cartSelectionControlsEl.style.display = 'none';
        checkoutBtn.style.display = 'none';
        return;
      }

      if (items.length === 0) {
        cartItemsEl.innerHTML = `<p style="text-align:center; color:#ddd; margin:10px 0;">Your cart is empty.</p>`;
        cartTotalEl.textContent = '';
        cartSelectionControlsEl.style.display = 'none';
        checkoutBtn.style.display = 'none';
        return;
      } else {
        cartSelectionControlsEl.style.display = 'flex';
        checkoutBtn.style.display = 'block';
      }

      renderCartSummary(items);
      const selectedIds = getSelectionForCart();
      updateSelectAllState(items, selectedIds);
      selectAllCheckbox.disabled = !canEdit;

      let selectedTotal = 0;
      let selectedItemCount = 0;

      items.forEach((item, itemIndex) => {
        const subtotal = item.price * item.qty;
        const itemId = String(item.id);
        const isSelected = selectedIds.has(itemId);
        if (isSelected) {
          selectedTotal += subtotal;
          selectedItemCount += item.qty;
        }
        const parsedTitle = parseCartTitle(item.title || 'Item');
        const safeBaseTitle = escapeHTML(parsedTitle.baseTitle || 'Item');
        const safeCustomNote = escapeHTML(parsedTitle.customNote || '');
        const itemImage = item.img && item.img.trim() ? item.img : 'images/placeholder.png';
        const safeItemImage = escapeHTML(itemImage);
        const titleId = `cart-item-title-${itemIndex}`;
        const disabledAttr = canEdit ? '' : 'disabled';

        const wrapper = document.createElement('div');
        wrapper.className = 'cart-item';

        wrapper.innerHTML = `
          <div class="cart-item-select">
            <input type="checkbox" class="cart-item-checkbox" ${isSelected ? 'checked' : ''} ${disabledAttr} aria-labelledby="${titleId}">
          </div>
          <img src="${safeItemImage}" alt="${safeBaseTitle}" onerror="this.src='images/placeholder.png'">
          <div class="cart-item-details">
            <div class="cart-item-header-row">
              <h4 id="${titleId}">${safeBaseTitle}</h4>
              ${parsedTitle.isCustomOrder ? '<span class="custom-order-badge">Custom Order</span>' : ''}
            </div>
            ${safeCustomNote ? `<p class="cart-item-note"><strong>Custom Color / Notes:</strong> ${safeCustomNote}</p>` : ''}
            <div class="qty-control" style="justify-content:flex-start; gap:8px; margin-top:6px;">
              <button class="qty-btn minus" aria-label="Decrease quantity" ${canEdit && item.qty > 1 ? '' : 'disabled'}>−</button>
              <span class="qty-value">${item.qty}</span>
              <button class="qty-btn plus" aria-label="Increase quantity" ${canEdit && item.qty < 99 ? '' : 'disabled'}>+</button>
            </div>
          </div>
          <div class="cart-item-price">${formatPrice(subtotal)}</div>
          <button class="remove-btn" ${disabledAttr}>Remove</button>
        `;

        const minus = wrapper.querySelector('.qty-btn.minus');
        const plus = wrapper.querySelector('.qty-btn.plus');
        const removeBtn = wrapper.querySelector('.remove-btn');
        const itemCheckbox = wrapper.querySelector('.cart-item-checkbox');

        itemCheckbox.addEventListener('change', () => {
          const nextSelection = cart.getSelection();
          if (itemCheckbox.checked) {
            nextSelection.add(itemId);
          } else {
            nextSelection.delete(itemId);
          }
          cart.setSelection(nextSelection);
          renderCart();
        });

        minus.addEventListener('click', () => runCartAction(() => cart.changeQty(item.id, -1)));
        plus.addEventListener('click', () => runCartAction(() => cart.changeQty(item.id, 1)));

        removeBtn.addEventListener('click', () => runCartAction(async () => {
          await cart.removeItems([item.id]);
          const nextSelection = cart.getSelection();
          nextSelection.delete(itemId);
          cart.setSelection(nextSelection);
        }));

        cartItemsEl.appendChild(wrapper);
      });

      cartTotalEl.textContent = `Total: ${formatPrice(selectedTotal)} • ${selectedItemCount} selected`;
      updateCheckoutState(selectedItemCount);
    }

    // Checkout: save the selected items as a demo order in this browser
    // (not linked to any account), then remove them from the current cart.
    // If the order can't be saved, the cart is left unchanged.
    checkoutBtn.addEventListener('click', async () => {
      if (checkoutInProgress || !cartState.canMutate || cartState.saving) return;
      const items = cartState.items;
      if (items.length === 0) return;
      const selectedIds = getSelectionForCart();
      const selectedItems = items.filter(item => selectedIds.has(String(item.id)));
      if (selectedItems.length === 0) {
        cartSelectionMessageEl.textContent = 'Select at least one item to checkout.';
        updateCheckoutState(0);
        return;
      }

      const total = selectedItems.reduce((sum, item) => sum + item.price * item.qty, 0);
      const now = new Date();
      const order = {
        id: 'JGV-' + now.getTime().toString().slice(-8),
        detailKey: window.JGV3DOrderUtils.createOrderDetailKey(),
        date: now.toISOString(),
        status: 'In Queue',
        items: selectedItems.map(item => ({
          id: item.id,
          title: item.title,
          img: item.img,
          qty: item.qty,
          price: item.price
        })),
        total: total
      };

      actionMessage = '';
      try {
        const orders = loadOrders();
        orders.push(order);
        saveOrders(orders);
      } catch (error) {
        actionMessage = 'Your demo order couldn\'t be saved in this browser, so nothing was removed from your cart. Please try again.';
        renderCart();
        return;
      }

      checkoutInProgress = true;
      renderCart();
      try {
        await cart.removeItems(selectedItems.map(item => item.id));
      } catch (error) {
        checkoutInProgress = false;
        actionMessage = `Your demo order ${order.id} was saved in this browser, but the items couldn't be removed from your cart (${(error && error.message) || 'unknown error'}). They are still in your cart — remove them manually to avoid ordering twice.`;
        renderCart();
        return;
      }

      window.location.href = 'orders.html';
    });

    selectAllCheckbox.addEventListener('change', () => {
      const ids = selectAllCheckbox.checked ? cartState.items.map(item => String(item.id)) : [];
      cart.setSelection(ids);
      renderCart();
    });

    cartRetryBtn.addEventListener('click', () => {
      actionMessage = '';
      cart.retry().catch(() => {});
    });

    cart.subscribe(state => {
      cartState = state;
      renderCart();
    });
  </script>
</body>
</html>
